# Builds the firmware and the browser emulator, and publishes the website (site/) with the browser installer and the
# Try it page (every release's emulator, and the next version's) to GitHub Pages.
# Runs on every published release, every 6 hours (so apps accepted into the store, github.com/Forrest404/unidex-apps,
# appear by themselves), or by hand from the Actions tab. The firmware always comes from the latest release tag, so
# a run that isn't a release still offers the released version, not whatever is on main.
name: Website

on:
  release:
    types: [published]
  workflow_dispatch:
  # schedule:
  #   - cron: "23 */6 * * *"

permissions:
  contents: write  # attaches the firmware files to the release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the version shown on the site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware from the latest release
        run: |
          set -e
          tag="${{ github.event.release.tag_name }}"
          [ -n "$tag" ] || tag="$(git describe --tags --abbrev=0)"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          git worktree add ../release "$tag"
          cd ../release && pio run -e epaper154

      # The Try it page (site/try.html) can run any release that has an emulator (v1.7 and newer) and the next
      # version (main), picked from a list; the newest release is the default. A release never changes, so its build is
      # kept in a cache and only made again when the emulator itself (emu/) changes.
      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-3.1.74

      - uses: actions/cache@v4
        with:
          path: emu-builds
          key: emu-builds-${{ hashFiles('emu/shim/**', 'emu/hw/**', 'emu/build.sh', 'emu/build_version.sh') }}-${{ github.run_id }}
          restore-keys: emu-builds-${{ hashFiles('emu/shim/**', 'emu/hw/**', 'emu/build.sh', 'emu/build_version.sh') }}-

      - name: Build the browser emulator for each release and the next version
        run: |
          set -e
          [ -d ~/emsdk ] || git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 3.1.74 >/dev/null
          ~/emsdk/emsdk activate 3.1.74 >/dev/null
          export EMSDK_ENV="$HOME/emsdk/emsdk_env.sh"
          mkdir -p emu-builds site/emu
          built=""
          for tag in $(git tag --sort=-v:refname); do
            git cat-file -e "$tag:emu/build.sh" 2>/dev/null || continue  # from before the emulator
            if [ ! -f "emu-builds/$tag/unidex.wasm" ] && ! bash emu/build_version.sh "$tag" "emu-builds/$tag"; then
              echo "::warning::the emulator for $tag didn't build; it's left out of the list"
              rm -rf "emu-builds/$tag"
              continue
            fi
            cp -R "emu-builds/$tag" "site/emu/$tag"
            built="$built $tag"
          done
          next=0
          bash emu/build_version.sh HEAD site/emu/next "$(git describe --tags --always)" && next=1 \
            || echo "::warning::the emulator for main didn't build; the next version is left out of the list"
          python3 - "$next" $built > site/emu/versions.json <<'PY'
          import json, sys
          tags, versions = sys.argv[2:], []
          for i, t in enumerate(tags):
              versions.append({"id": t, "label": f"{t} (latest release)" if i == 0 else t})
          if sys.argv[1] == "1":
              versions.append({"id": "next", "label": "Next version (in development)"})
          print(json.dumps({"latest": tags[0] if tags else "next", "versions": versions}, indent=1))
          PY
          cat site/emu/versions.json

      - name: Collect firmware and write the installer manifests
        run: |
          set -e
          out=site/firmware
          mkdir -p "$out"
          b=../release/.pio/build/epaper154
          cp "$b/bootloader.bin" "$b/partitions.bin" "$b/firmware.bin" "$out/"
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin "$out/"
          version="$RELEASE_TAG"
          python3 - "$out" "$version" <<'PY'
          import json, sys
          out, version = sys.argv[1], sys.argv[2]
          parts = [("bootloader.bin", 0x0), ("partitions.bin", 0x8000), ("boot_app0.bin", 0xE000),
                   ("firmware.bin", 0x10000)]  # files live on the SD card: no filesystem image
          def manifest(parts, erase):
              return {"name": "unidex", "version": version, "new_install_prompt_erase": erase,
                      "new_install_improv_wait_time": 0,
                      "builds": [{"chipFamily": "ESP32-S3",
                                  "parts": [{"path": p, "offset": o} for p, o in parts]}]}
          # Install: everything, offered with a full erase. Update: the app only, so data stays.
          json.dump(manifest(parts, True), open(f"{out}/install.json", "w"), indent=2)
          json.dump(manifest([p for p in parts if p[0] == "firmware.bin"], False), open(f"{out}/update.json", "w"), indent=2)
          PY
          ls -la "$out"

      - name: Attach the firmware files to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          d=$(mktemp -d)
          for f in bootloader.bin partitions.bin boot_app0.bin firmware.bin; do
            cp "site/firmware/$f" "$d/unidex-$RELEASE_TAG-$f"
          done
          (cd "$d" && sha256sum unidex-* > "unidex-$RELEASE_TAG-SHA256SUMS.txt")
          gh release upload "$RELEASE_TAG" "$d"/* --clobber

      - name: Build the app store catalogue (site/store/) from the accepted apps
        run: |
          git clone https://github.com/Forrest404/unidex-apps.git ../unidex-apps  # with history: each app's last update
          python3 tools/make_store.py ../unidex-apps/apps --source https://github.com/Forrest404/unidex-apps/tree/main/apps
          # The App editor's starting points (site/editor.html): the registry's own templates
          mkdir -p site/starters
          cp -R ../unidex-apps/template/my-app site/starters/app
          cp -R ../unidex-apps/template/my-badge site/starters/badge

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
