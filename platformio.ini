; Waveshare ESP32-S3-ePaper-1.54 (V2) — ESP32-S3-PICO-1-N8R8
; 8 MB QIO flash + 8 MB octal PSRAM, native USB (no UART bridge).
[env:epaper154]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; USB-Serial/JTAG peripheral
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB
